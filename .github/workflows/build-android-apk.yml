name: Build ZIRIGO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "config.js"
      - "supabase-config.js"
      - "manifest.webmanifest"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ZIRIGO
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Prepare ZIRIGO website files
        run: |
          mkdir -p www/assets
          cp index.html styles.css app.js config.js supabase-config.js manifest.webmanifest www/
          cp -R assets/. www/assets/

      - name: Generate Android project
        run: npx cap add android

      - name: Sync ZIRIGO web app
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload ZIRIGO APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIRIGO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
