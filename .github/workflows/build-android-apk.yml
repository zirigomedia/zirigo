name: Build ZIRIGO Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - "admin.html"
      - "admin.js"
      - "admin.webmanifest"
      - "styles.css"
      - "app.js"
      - "config.js"
      - "supabase-config.js"
      - "manifest.webmanifest"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ZIRIGO
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install

      - name: Prepare ZIRIGO website files
        run: |
          mkdir -p www/assets
          cp index.html admin.html styles.css app.js admin.js config.js supabase-config.js manifest.webmanifest admin.webmanifest www/
          cp -R assets/. www/assets/

      - name: Generate Android project
        run: npx cap add android

      - name: Apply ZIRIGO Android branding and display fixes
        run: |
          python -m pip install Pillow
          python scripts/android-setup.py

      - name: Sync ZIRIGO web app
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publish latest ZIRIGO APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "$APK_PATH#ZIRIGO.apk" --clobber
          else
            gh release create android-latest "$APK_PATH#ZIRIGO.apk" \
              --title "ZIRIGO Android App" \
              --notes "Latest installable ZIRIGO Android app. Download ZIRIGO.apk and install it on your Android device."
          fi

      - name: Upload ZIRIGO APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIRIGO-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
